spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/formwork
    username: formwork
    password: formwork
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 18081

formwork:
  sms-channel:
    provider: TWILIO
    fallback-provider: VONAGE
    twilio:
      account-sid: AC123
      auth-token: token
      from-number: +15551234567
    vonage:
      api-key: demo-key
      api-secret: demo-secret
      from-number: Demo
