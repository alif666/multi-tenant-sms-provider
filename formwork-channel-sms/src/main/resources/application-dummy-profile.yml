spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/formwork
    username: formwork
    password: formwork
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080

formwork:
  sms-channel:
    demo-enabled: true
    provider: TWILIO
    fallback-provider: VONAGE
    retry:
      max-attempts: 2
      backoff: 10ms
